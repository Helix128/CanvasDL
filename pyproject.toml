[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvasdl"
version = "1.1.0"
description = "Canvas LMS CLI & Model Context Protocol (MCP) Server for Claude Code and Claude Web"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Helix128" }
]
keywords = ["canvas", "mcp", "claude", "claude-code", "claude-web", "model-context-protocol", "lms", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "mcp>=1.0.0,<2",
    "starlette>=0.38.0",
    "playwright>=1.40.0",
]

[project.scripts]
canvasdl = "app.cli:main"
canvasdl-mcp = "app.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]
exclude = [
    "*.txt",
    "*.json",
    ".env*",
    "downloads*",
    ".venv*",
]

[tool.hatch.build.targets.sdist]
include = [
    "/app",
    "/README.md",
    "/pyproject.toml",
    "/install.sh",
]
exclude = [
    "canvas_token.txt",
    "session.json",
    "settings.json",
    ".env*",
    "downloads*",
    ".venv*",
]
